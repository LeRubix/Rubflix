ShortDescription: A Netflix-style desktop app for your local video library with universal MPV playback.
Description: |
  Kudflix is an offline desktop media player for your local video collection with a sleek Netflix-style user interface.
  Built with Electron, React, and an embedded MPV engine for native support of all audio formats (AC-3, E-AC-3, DTS, TrueHD),
  styled anime subtitles, TMDB metadata auto-scraping, and Discord Rich Presence.
